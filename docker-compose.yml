version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduindia-postgres
    restart: always
    environment:
      POSTGRES_DB: eduindia_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduindia-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eduindia_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: dGhpcy1pcy1hLXNlY3VyZS01MTItYml0LXNlY3JldC1rZXktZm9yLWVkdWluZGlhLXBvcnRhbC1wcm9qZWN0LTIwMjY=
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-mock_key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-mock_secret}
      AWS_REGION: ap-south-1
      AWS_S3_BUCKET: eduindia-documents
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_mock}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-mock_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-mock_webhook}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduindia-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_mock}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
